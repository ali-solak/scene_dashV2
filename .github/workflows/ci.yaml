name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze
      - run: dart test
        working-directory: packages/scene_dash_v2_core
      - run: dart test
        working-directory: examples/headless_example

  integration:
    name: integration (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
        working-directory: packages/scene_dash_v2
      - run: flutter test
        working-directory: examples/scene_game
      - run: flutter test
        working-directory: examples/combat_sample
      - run: flutter test
        working-directory: examples/basic_example_tower_defense

