name: scene_dash_v2_example
description: "Minimal Scene-Dash v2 game: a cube orbiting under an ECS system."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cupertino_ui: ^1.0.0
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  scene_dash_v2:
    path: ../
  flutter_scene: ^0.22.1
  vector_math: ^2.4.2

dev_dependencies:
  flutter_lints: ^6.0.0

# This example is outside the workspace, so it resolves scene_dash_v2_core from
# pub.dev. Until the matching core version is published, point it at the local
# copy. REMOVE BEFORE PUBLISHING: example/ ships inside the package archive and
# this path does not exist for consumers.
dependency_overrides:
  scene_dash_v2_core:
    path: ../../scene_dash_v2_core
