name: scene_dash_v2
description: >-
  Scene-Dash v2 for flutter_scene: organize and test gameplay code while
  keeping rendering, scenes, cameras, physics, and widgets native. Includes
  SceneGame boot, node binding, transform sync, physics hooks, and world-backed
  UI primitives over the scene_dash_v2_core engine.
version: 0.1.0
repository: https://github.com/ali-solak/scene_dashV2/tree/main/packages/scene_dash_v2
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  scene_dash_v2_core: ^0.1.0
  flutter_scene: ^0.20.0
  vector_math: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
