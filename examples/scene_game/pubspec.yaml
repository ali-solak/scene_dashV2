name: scene_game
description: >-
  Rock Dodge, the Scene-Dash v2 reference game: dodge rocks rolling down a
  ramp using a kinematic character controller. Requires Flutter 3.47+ with
  Flutter GPU (`flutter run --enable-flutter-gpu`).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.0
  flutter_scene_rapier: ^0.5.2
  material_ui: ^1.0.0
  scene_dash_v2:
    path: ../../packages/scene_dash_v2
  vector_math: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
