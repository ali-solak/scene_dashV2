name: scene_game
description: >-
  Rock Dodge, the Scene-Dash v2 reference game: dodge rocks rolling down a
  ramp using a kinematic character controller. . Requires the Flutter master
  channel + Flutter GPU (`flutter run --enable-flutter-gpu`).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.16.0"

dependencies:
  cupertino_ui: ^1.0.0
  flutter:
    sdk: flutter
  flutter_scene: ^0.20.0
  flutter_scene_rapier: ^0.4.0
  material_ui: ^1.0.0
  # The in-app inspector overlay — optional tooling, wired behind the
  # debug toggles.
  scene_dash_inspector:
    path: ../../packages/scene_dash_inspector
  scene_dash_v2:
    path: ../../packages/scene_dash_v2
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
